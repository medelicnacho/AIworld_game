<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap only: the tab needs a name before any module loads. config.js GAME_TITLE is
         the authority and main.js overwrites this the moment it runs. -->
    <title>War Parkour</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
      canvas { display: block; }
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfd6e4; text-shadow: 0 1px 2px #000a;
      }
      /* The dev/debug dump — demoted to a small, dim top-left block now that the real HUD
         (health, ammo, abilities) carries the important state Overwatch-style. */
      #stats { position: absolute; top: 8px; left: 10px; white-space: pre; opacity: .4;
        font-size: 10px; line-height: 1.35; max-width: 44vw; }
      /* --- Overwatch-style HUD: big health bottom-left, big ammo bottom-right --------- */
      /* THE TWO BLOCKS THAT MATTER MOST, LIFTED AND DRAWN IN.
         Health and the weapon were pinned to the bottom corners, which is the furthest any
         two things on a screen can be from each other — and from the crosshair, where your
         eyes actually live. Reading "how much have I got left" meant a trip to one corner and
         reading "can I still shoot" meant a trip to the other, in a game whose whole pitch is
         movement. Raised well clear of the ability bar and pulled in toward the middle, they
         both sit inside the same downward glance. Still low, because they are not what you
         aim with — just no longer in the far corners of a 1536-wide screen. */
      #health { position: absolute; left: 120px; bottom: 230px; width: 300px;
        font: ui-sans-serif, system-ui, sans-serif; text-shadow: 0 2px 6px #000c; }
      #health .hp-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
      #health .hp-num { font-size: 40px; font-weight: 800; color: #eaf6ff; line-height: .9; }
      #health .hp-max { font-size: 16px; font-weight: 600; color: #9fb2cc; }
      #health .hp-arm { margin-left: auto; font-size: 13px; font-weight: 700; color: #8fd6ff;
        letter-spacing: .04em; }
      #health .hp-track { height: 15px; background: #0d1420cc; border: 2px solid #ffffff2e;
        border-radius: 3px; overflow: hidden;
        /* segment ticks, the Overwatch look */
        background-image: repeating-linear-gradient(90deg, transparent 0 30px, #0008 30px 32px);
        background-color: #0d1420cc; }
      /* HEALTH IS GREEN, AND GOES RED. It used to be near-white, which reads as "a bar" and
         nothing else — you had to check the NUMBER to know how you were doing. Colour is the
         fastest channel there is, so the bar itself now carries the state: bright green while
         you are fine, amber when it is worth noticing, red when it is the only thing that
         matters. Three steps rather than a smooth fade, because a continuous gradient never
         crosses a line you can feel — a step change is an event you notice in the corner of
         your eye mid-fight, which is the entire point of putting it there. */
      #health .hp-fill { height: 100%; background: linear-gradient(#8dffb0, #35d96e);
        transition: width .12s linear, background .2s, box-shadow .2s;
        box-shadow: 0 0 10px #35d96e88; }
      #health.warn .hp-fill { background: linear-gradient(#ffd98a, #ffab3d);
        box-shadow: 0 0 11px #ffab3d99; }
      #health.warn .hp-num { color: #ffc46b; }
      #health.low .hp-fill { background: linear-gradient(#ff9a8a, #ff3b2e);
        box-shadow: 0 0 14px #ff3b2ebb; }
      #health.low .hp-num { color: #ff7a68; }
      #ammo { position: absolute; right: 240px; bottom: 280px; text-align: right;
        font: ui-sans-serif, system-ui, sans-serif; text-shadow: 0 2px 6px #000c; }
      #ammo .am-name { font-size: 12px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; color: #9fb2cc; margin-bottom: 2px; }
      #ammo .am-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
      #ammo .am-cur { font-size: 52px; font-weight: 800; color: #eaf6ff; line-height: .85; }
      #ammo .am-cur.low { color: #ffb454; }
      #ammo .am-max { font-size: 20px; font-weight: 600; color: #9fb2cc; }
      #ammo .am-reload { font-size: 30px; font-weight: 800; color: #ffb454; letter-spacing: .04em; }
      #ammo .am-stow { font-size: 22px; font-weight: 700; color: #7dffb5; letter-spacing: .04em; }
      #health .hp-lvl { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: #ffe08a;
        margin-bottom: 3px; }
      /* NAMED, now that the bar is green. A green bar beside an amber one beside a blue one is
         three colours a new player has to be taught; a word is one they already know. White,
         because the fill changes colour and a label that changed with it would read as part of
         the state rather than as the thing being labelled. */
      #health .hp-word { color: #fff; font-weight: 700; letter-spacing: .18em; opacity: .85; }
      /* XP bar — a long thin BLUE bar sitting directly on top of the ability bar. */
      /* overflow VISIBLE, not hidden: the bar's floating label lives above the box, and
         overflow:hidden was silently clipping it to nothing. The fill rounds itself. */
      #xp { position: absolute; left: 50%; transform: translateX(-50%); bottom: 108px;
        width: min(720px, 92vw); height: 6px; background: #0a1220cc;
        border: 1px solid #1c3050; border-radius: 4px; }
      #xp .xp-fill { height: 100%; background: linear-gradient(90deg, #2f8fff, #7fd0ff);
        box-shadow: 0 0 10px #4aa8ffbb; transition: width .25s linear; border-radius: 3px; }
      #xp .xp-txt { position: absolute; right: 2px; bottom: 19px; font-size: 10px; font-weight: 700;
        letter-spacing: .1em; color: #9fccffcc; text-shadow: 0 2px 5px #000c; }
      /* Reputation bar — a second thin bar DIRECTLY above the XP bar, in your faction's
         colour. XP is who you are; reputation is who you are WITH someone — the two long
         climbs of the game, stacked, so both are read in the same glance. Hidden until a
         faction is joined (main.js), because a bar for a ladder you are not on is noise. */
      #rep { position: absolute; left: 50%; transform: translateX(-50%); bottom: 118px;
        width: min(720px, 92vw); height: 5px; background: #0a1220cc;
        border: 1px solid #1c3050; border-radius: 4px; }
      #rep .rep-fill { height: 100%; transition: width .25s linear, filter .3s;
        box-shadow: 0 0 8px #0006 inset; border-radius: 3px; }
      #rep.flash .rep-fill { filter: brightness(1.9); }
      #rep .rep-txt { position: absolute; left: 2px; bottom: 8px; font-size: 10px; font-weight: 700;
        letter-spacing: .1em; text-shadow: 0 2px 5px #000c; }
      /* ENERGY — the spell budget, directly under the ability bar it governs.
         Read WITHOUT looking at it: the whole tension of the resource is the near-miss, the
         moment it is visibly ALMOST enough for one more cast, and a number you have to focus
         on to parse cannot carry that. So it is length and colour — amber while it fills,
         white when it is full and everything is available, and a hard red flash when a cast
         is refused, which is the only time it needs to shout. */
      /* ENERGY sits in the middle of the bottom stack — under the jump chevrons, over the
         points line — rather than beneath the xp bar. Energy is a COMBAT resource: it is read
         in the same glance as "have I got another jump", and it was living below the xp bar
         with the progression furniture, the part of the HUD you only look at between fights.
         Thicker, too, for the same reason: at 7px it read as a rule under the xp bar. */
      #energy { position: absolute; left: 50%; transform: translateX(-50%); bottom: 157px;
        width: min(420px, 60vw); height: 11px; background: #1a1206cc;
        border: 1px solid #4a3a12; border-radius: 4px; overflow: hidden; }
      /* The word sits INSIDE the bar — there is no room above it, and a label floating over
         the gap between two bars belongs to neither. Centred and dim enough to read as an
         engraving rather than as content, so it names the bar without competing with it. */
      #energy .en-word { position: absolute; inset: 0; display: grid; place-content: center;
        font: 700 8px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .22em;
        color: #fff; opacity: .72; text-shadow: 0 1px 2px #0009; pointer-events: none; }
      /* BRIGHT ORANGE. The old amber sat a shade off the xp bar's gold and the points line
         above it, so three different meanings shared one family of colour and the bar you
         read MID-CAST looked like the two you only read between fights. Orange is nothing
         else on this screen. */
      #energy .en-fill { height: 100%; width: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #ff7a1e, #ffa63d);
        box-shadow: 0 0 10px #ff7a1e88; transition: width .06s linear, background .15s; }
      #energy.full .en-fill { background: linear-gradient(90deg, #ffb057, #ffd9a0);
        box-shadow: 0 0 12px #ffa63daa; }
      #energy.starved { animation: enflash .3s ease-out; }
      @keyframes enflash {
        from { border-color: #ff5a4a; box-shadow: 0 0 14px #ff3b2ecc; }
        to { border-color: #4a3a12; box-shadow: none; }
      }
      /* JUMP CHARGES — chevrons under the character, just above the rest of the HUD.
         In a game about leaping between ledges, "do I have another jump" is a question you
         ask in mid-air with no time to look anywhere, so the answer sits directly below
         where your character is and reads as a shape rather than a number. They point UP
         because that is what they buy you. It counts however many you actually have, since
         maxJumps grows with level (XP.jumpsPerLevels) and a hardcoded pair would quietly
         start lying at the exact moment you earned a third. */
      #jumps { position: absolute; left: 50%; bottom: 176px; transform: translateX(-50%);
        display: flex; gap: 7px; pointer-events: none; }
      #jumps i { width: 0; height: 0; border-left: 7px solid transparent;
        border-right: 7px solid transparent; border-bottom: 10px solid #7fd0ff;
        filter: drop-shadow(0 1px 3px #000c);
        transition: border-bottom-color .1s, opacity .1s; }
      /* Spent ones stay in place rather than disappearing — the gap that is missing is the
         information, and a row that changes LENGTH is much harder to read at a glance than
         one that changes colour. */
      #jumps i.spent { border-bottom-color: #44566e; opacity: .5; }
      #crosshair {
        position: absolute; left: 50%; top: 50%; width: 3px; height: 3px;
        margin: -1.5px 0 0 -1.5px; background: #eef; border-radius: 50%;
        box-shadow: 0 0 0 1px #0008; opacity: 0; transition: opacity .12s;
      }
      #minimap {
        position: absolute; top: 12px; right: 12px;
        /* Sized from JS to fit the window (see ui/minimap.js resize) — these are only the
           fallback before the first sizing pass. */
        width: 180px; height: 180px;
        filter: drop-shadow(0 2px 6px #0008);
        transition: opacity .18s ease;
      }
      /* Out of the way while a panel owns the screen. The map is the busiest thing on the
         HUD and it is pure noise behind a price list or a character sheet. */
      body.shopping #minimap, body.inv #minimap { opacity: .12; }
      /* The chat with a villager (G). A low panel, not a fullscreen takeover — you are
         standing in the square talking to someone, and the town should stay visible. */
      #chat { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%);
        width: min(560px, 90vw); background: #0d1420ee; border: 1px solid #2a3b55;
        border-radius: 10px; padding: 10px 12px; display: none; z-index: 30;
        pointer-events: auto;   /* the hud layer is pointer-events:none; the input isn't */
        font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; color: #dfe9f7; }
      #chat.show { display: block; }
      #chat .who { font-weight: 700; color: #ffd45e; letter-spacing: .04em; margin-bottom: 6px; }
      #chat .lines { max-height: 130px; overflow-y: auto; margin-bottom: 8px; }
      #chat .lines div { margin: 3px 0; }
      #chat .lines .you b { color: #7fd0ff; }
      #chat .lines .them b { color: #63d1a0; }
      #chat .lines .prior { opacity: .5; }   /* an earlier visit — memory, not this talk */
      #chat .row { display: flex; gap: 8px; }
      #chat input { flex: 1; background: #0a1220; border: 1px solid #2a3b55; color: #eaf2ff;
        border-radius: 6px; padding: 7px 10px; font: inherit; outline: none; }
      #chat input:focus { border-color: #4a6b9b; }
      #chat button { background: #1c3050; border: 1px solid #35507c; color: #cfe2ff;
        border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
      /* The sleep fade. All black, slow, with one quiet line — the town is dreaming, and
         the dark is where its long-term memory gets written (town/voice.js consolidate). */
      #sleep { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
        transition: opacity .9s ease; z-index: 60; display: grid; place-content: center;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; color: #9fb2cc; letter-spacing: .12em; }
      #sleep.show { opacity: 1; }
      /* WHO IS SPEAKING. This sat at `bottom: 12%` while everything it stacks against is
         measured in pixels — so on any ordinary window 12% landed straight on the rep bar
         and the name of the person talking to you was unreadable. A caption belongs at a
         fixed distance above the bars it must clear, not at a fraction of the window. */
      #subtitle {
        position: absolute; left: 50%; bottom: 228px; transform: translateX(-50%);
        max-width: 60%; text-align: center; opacity: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; color: #eaf2ff;
        text-shadow: 0 2px 8px #000c, 0 0 14px #000a; transition: opacity .25s;
      }
      #shop { position: absolute; inset: 0; display: none; place-content: center;
        pointer-events: auto; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
      body.shopping #shop { display: grid; }
      #shop .panel { width: min(560px, 88vw); background: #121722f2; color: #dfe8f5;
        border: 1px solid #2f3d55; border-radius: 10px; overflow: hidden;
        box-shadow: 0 18px 60px #000a; }
      #shop header { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
        background: #1a2233; border-bottom: 1px solid #2f3d55; }
      #shop h2 { margin: 0; font-size: 15px; letter-spacing: .04em; flex: 1; }
      #shop .gold { color: #ffd45e; font-weight: 600; }
      #shop .x { background: none; border: 0; color: #8fa3bf; font-size: 15px; cursor: pointer; }
      #shop .items { max-height: 52vh; overflow-y: auto; }
      #shop .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
        width: 100%; text-align: left; padding: 11px 14px; background: none; border: 0;
        border-bottom: 1px solid #222c3e; color: inherit; cursor: pointer; font: inherit; }
      #shop .item:hover { background: #1c2739; }
      #shop .item.poor { opacity: .45; cursor: not-allowed; }
      #shop .nm { font-weight: 600; }
      #shop .nm em { color: #7fd4a0; font-style: normal; font-size: 11px; }
      #shop .ds { grid-column: 1; color: #93a6c0; font-size: 12px; }
      #shop .pr { grid-row: 1 / span 2; align-self: center; color: #ffd45e; font-weight: 600; }
      #shop .empty { padding: 18px 14px; color: #93a6c0; margin: 0; }
      /* THE QUARTERMASTER. A different panel from a price list, because it answers a
         different question: not what do you want, but whose side are you on. */
      #shop .qm { padding: 14px; }
      #shop .qmlead { margin: 0 0 8px; font-size: 15px; letter-spacing: .02em; }
      /* The weapon pitch — the loudest thing on the recruiter's desk, because the weapon
         is what actually changes how you play. Boxed and faction-tinted so the eye lands
         here before the prose beneath it. */
      #shop .qmweapon { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; line-height: 1.5;
        padding: 8px 10px; border-radius: 6px; background: #ffffff08; border: 1px solid #ffffff1a; }
      #shop .qmspec { margin: 0 0 10px; font-size: 12.5px; font-weight: 600; color: #ffd45e;
        letter-spacing: .03em; }
      #shop .qmblurb { margin: 0 0 10px; color: #cdd8ea; font-size: 13px; line-height: 1.5; }
      #shop .qmnote { margin: 0 0 10px; color: #93a6c0; font-size: 12px; line-height: 1.5; }
      #shop .qmnote b { color: #dfe8f5; }
      #shop .join { background: #1d2536; border: 1px solid #4a5a7d; color: #e8f0ff;
        border-radius: 6px; padding: 9px 18px; cursor: pointer; font: inherit;
        font-size: 14px; margin-top: 4px; }
      #shop .join:hover { background: #27324a; }
      /* The ladder, always visible while you shop — the number you are actually here for. */
      #shop .repbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        font-size: 12px; }
      #shop .reptier { font-size: 14px; letter-spacing: .04em; }
      #shop .reptrack { color: #ffc03a; letter-spacing: -1px; font-family: ui-monospace, monospace; }
      #shop .repnum { color: #8fa3bf; }
      /* Stock you have not earned yet. Shown rather than hidden, because a ladder you cannot
         see the next rung of is just a number going up. */
      #shop .item.locked { opacity: .45; cursor: default; }
      #shop .item.locked .pr { color: #b39a5e; }
      #shop .sellitem.off { opacity: .4; cursor: default; }
      /* The right-click readout beside the ammo — the RMB is a real ability on the faction
         weapons now, and a cooldown you cannot see is a cooldown you do not use. */
      #ammo .am-rc { font-size: 12px; color: #8fa3bf; margin-left: 12px; letter-spacing: .04em; }
      #ammo .am-rc.up { color: #9fe8b5; }
      #ammo .am-rc.on { color: #ffe08a; }
      /* THE CLEAVER'S SHOVE — pips, not a number, at the weight of the side readouts.
         It is read MID-SWING with a crowd on you, so it has to answer "have I got one" from
         peripheral vision: a row of dots is a shape you catch without looking, where a digit
         is something you stop and parse. Tucked in the corner beside the spin it was neither
         — too small to catch and too far from where your eyes actually are. Centred and sized
         like the health and ammo blocks, it sits in the same glance as the crosshair. */
      /* WHAT THE WEAPON CAN DO FOR YOU RIGHT NOW — under the weapon, on the right.
         Shove and spin are the same question asked twice ("have I got one, and if not, how
         long"), so they are the same shape: a name, a row of lit pips, and a countdown that
         only exists while something is genuinely coming back. Written as two rows of one
         component rather than two bespoke widgets, because the moment they look different is
         the moment reading one stops teaching you how to read the other. */
      /* CLEAR OF THE BARS. At 106 the SHOVE row occupied 106-122 and the xp bar sits at
         108-114 — the two were drawn straight through each other, and the pips read as debris
         on top of the progress bar. The centre bars own the strip from 108 up to about 123, so
         everything on the right starts above that and stacks upward from there: charges first,
         then the weapon they belong to. */
      #wpncd { position: absolute; right: 240px; bottom: 212px;
        display: none; flex-direction: column; align-items: flex-end; gap: 7px;
        pointer-events: none; font: 700 14px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .12em; color: #9fb2cc; text-shadow: 0 2px 6px #000c; }
      body.running #wpncd.on { display: flex; }
      #wpncd .wr { display: flex; align-items: center; gap: 9px; }
      #wpncd i { width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid #8fa3bf66; background: #0d142088;
        filter: drop-shadow(0 1px 3px #000c); transition: background .1s, box-shadow .1s; }
      #wpncd i.lit { background: linear-gradient(#d8ffe6, #9fe8b5); border-color: #9fe8b5;
        box-shadow: 0 0 12px #9fe8b5aa; }
      /* Mid-spin is its own state, not a spent one — you are inside the thing right now. */
      #wpncd i.act { background: linear-gradient(#fff2c9, #ffd45e); border-color: #ffd45e;
        box-shadow: 0 0 14px #ffd45ecc; }
      /* SPIN IS A DIAL, not a pip, because it is one thing on a clock rather than a pool you
         spend from. A conic sweep says "how much of the wait is done" without being read as a
         number — you catch a three-quarter-full circle in the same glance that told you an
         enemy was closing, which a countdown in seconds can never do. The green grows INTO
         the grey, so the shape you are waiting for is the completed circle. */
      #wpncd .dial { width: 26px; height: 26px; border-radius: 50%;
        background: conic-gradient(#9fe8b5 var(--p, 0%), #2b3444 0);
        border: 2px solid #8fa3bf66; filter: drop-shadow(0 1px 3px #000c);
        transition: background .08s linear; }
      #wpncd .dial.full { background: radial-gradient(circle, #d8ffe6 0%, #9fe8b5 70%);
        border-color: #9fe8b5; box-shadow: 0 0 14px #9fe8b5aa; }
      #wpncd .dial.act { background: radial-gradient(circle, #fff2c9 0%, #ffd45e 70%);
        border-color: #ffd45e; box-shadow: 0 0 16px #ffd45ecc; }
      #wpncd .wr.out .wr-k { color: #ff8a7a; }
      #wpncd .wr.act .wr-k { color: #ffd45e; }
      #wpncd .wr-t { font-weight: 600; font-size: 12px; color: #b9c6da; letter-spacing: .06em; }
      /* How many shells the next volley throws. Full is the weapon working as designed, so it
         reads as plain state; SHORT is a warning, because a three-shell volley looks like a
         six-shell one right up until it fails to clear the room. */
      #wpncd .wr-n { font-weight: 800; font-size: 14px; color: #eaf2ff; letter-spacing: .04em; }
      #wpncd .wr-n.short { color: #ffb057; }
      #shop footer { padding: 9px 14px; background: #161d2b; color: #8fa3bf; font-size: 12px; }
      #shop .panel.wide { width: min(820px, 94vw); }
      #shop .cols { display: grid; grid-template-columns: 1fr 1fr; }
      #shop .col { min-width: 0; }
      #shop .col.sellcol { border-left: 1px solid #222c3e; background: #0e1420; }
      #shop .col h3 { margin: 0; padding: 10px 14px 4px; font-size: 11px; letter-spacing: .1em;
        color: #8fa3bf; text-transform: uppercase; }
      #shop .sellall { display: block; width: calc(100% - 28px); margin: 4px 14px 8px;
        background: #3a3550; border: 1px solid #5a4d7d; color: #d9cbff; border-radius: 6px;
        padding: 6px; cursor: pointer; font: inherit; font-size: 12px; }
      #shop .sellall.off { opacity: .4; cursor: default; }
      #shop .sellitems { max-height: 46vh; }
      #shop .sellitem { display: flex; justify-content: space-between; align-items: center;
        width: calc(100% - 20px); margin: 4px 10px; gap: 10px; background: #46536b55;
        border: 1px solid #6b7a95; border-radius: 6px; padding: 7px 10px; cursor: pointer;
        font: inherit; text-align: left; }
      #shop .sellitem:hover { background: #1c2739; }
      #shop .sellitem .nm { font-size: 12px; font-weight: 600; }
      #shop .sellitem .pr { color: #ffd45e; font-weight: 600; font-size: 12px; }
      @media (max-width: 640px) { #shop .cols { grid-template-columns: 1fr; }
        #shop .col.sellcol { border-left: 0; border-top: 1px solid #222c3e; } }
      body.shopping #click { display: none; }
      body.inv #click { display: none; }
      body.dead #click { display: none; }
      /* Death screen — a dark takeover with the one action: respawn. */
      #death { position: absolute; inset: 0; display: none; place-content: center;
        pointer-events: auto; background: #06080cd8;
        font: ui-sans-serif, system-ui, sans-serif; text-align: center; }
      body.dead #death { display: grid; }
      #death .dpanel { padding: 30px 40px; }
      #death h1 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: .12em;

      #inv .panel { width: min(940px, 95vw); max-height: 88vh;

      /* THE LOW-HEALTH BREATH. Same vignette shape as #hurt because it is the same language —
         danger comes from the edges — but deeper, wider and driven slowly. Its own element
         rather than a second use of #hurt: they overlap constantly (you are usually being hit
         while you are nearly dead) and sharing one opacity would mean each one erasing the
         other's message. Declared BEFORE #hurt so a fresh hit still flashes over the top.
         No CSS animation: the pace lives in config.js LOWHP and is driven per frame, so there
         is no second copy of the timing to drift. */
      #lowhp {
        position: absolute; inset: 0; opacity: 0; pointer-events: none;
        /* Three stops, not two. With only a clear centre and a red rim the colour lives in
           the extreme corners and most of the frame is a wash — which on a bright green
           hillside reads as the screen being dirty rather than as blood. The middle stop
           carries real red well inside the edge, where peripheral vision actually is. */
        background: radial-gradient(ellipse at center,

      #difficulty .mode.hardcore .nm { color: #ff5a4a; }
      #difficulty .mode.easy .nm { color: #7fe0a0; }
      /* SELECTED — the whole box goes green and glows, and the other card dims back. */
      #difficulty .mode.sel { border-color: #4fe08a; background: #123020;
        box-shadow: 0 0 26px rgba(79,224,138,0.6), inset 0 0 22px rgba(79,224,138,0.16);
        transform: translateY(-2px); }
      #difficulty .mode.sel .nm { color: #8affc0; }
      #difficulty .modes.chosen .mode:not(.sel) { opacity: .45; }
      /* THE FACTION CARDS carry far more than the difficulty ones — a weapon name and five
         lines about how it fights — because this choice is made before the player has seen
         anything, and a blurb cannot teach a weapon. Wider, and each card tinted with its own
         colour so the three read apart at a glance before a word is read. */
      #difficulty .modes.factions { max-width: 1020px; }
      #difficulty .mode.fac { max-width: 330px; border-color: color-mix(in srgb, var(--fc) 45%, #2a3548); }
      #difficulty .mode.fac:hover { border-color: var(--fc);
        background: color-mix(in srgb, var(--fc) 10%, #141b28); }
      #difficulty .mode.fac .nm { margin-bottom: 2px; }
      #difficulty .mode.fac .wpn { display: block; font-size: 11px; letter-spacing: .14em;
        text-transform: uppercase; color: #8fa3bf; margin-bottom: 10px; }
      #difficulty .mode.fac .bl { display: block; margin-bottom: 10px; }
      #difficulty .mode.fac .ps { margin: 0; padding-left: 15px; }
      #difficulty .mode.fac .ps li { font-size: 11.5px; line-height: 1.5; color: #9fb0c8;
        margin-bottom: 5px; }
      /* The LAST line of every card is what it is bad at — dimmer, so it reads as the caveat
         it is rather than as one more selling point. */
      #difficulty .mode.fac .ps li:last-child { color: #7c8ba3; font-style: italic; }
      #difficulty .mode.fac.sel { border-color: var(--fc);
        background: color-mix(in srgb, var(--fc) 16%, #141b28);
        box-shadow: 0 0 26px color-mix(in srgb, var(--fc) 55%, transparent); }
      #difficulty .mode.fac.sel .nm { color: #fff; }
      /* The start prompt — hidden until a difficulty is chosen, then green and pulsing. */
      #difficulty .startbtn { margin-top: 22px; padding: 12px 28px; border-radius: 8px;
        font: inherit; font-size: 15px; letter-spacing: .1em; cursor: pointer;
        background: #123020; color: #8affc0; border: 2px solid #4fe08a;
        box-shadow: 0 0 22px rgba(79,224,138,0.5); animation: startpulse 1.3s ease-in-out infinite; }
      #difficulty .startbtn.hidden { display: none; }
      @keyframes startpulse { 0%,100%{ box-shadow: 0 0 16px rgba(79,224,138,0.4); }
        50%{ box-shadow: 0 0 30px rgba(79,224,138,0.8); } }
      #difficulty .hint { margin-top: 16px; color: #6f819b; font-size: 11px; }
      /* LEVEL-UP BANNER — big, bright, and gone in a moment. The golden beam already fires
         at your feet; this is the WORD to go with it, so a level-up is felt as an event and
         not just a bar resetting. Purely cosmetic, driven from JS on the frame it happens. */
      .plate.ally { color: #7fe0a0; border-color: rgba(95,224,138,0.5);
        text-shadow: 0 0 8px rgba(95,224,138,0.6); letter-spacing: .12em; font-size: 10px; }
      .plate.ally .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
        background: #5fe08a; box-shadow: 0 0 7px #5fe08a; margin-right: 5px; vertical-align: middle; }
      /* Raid champion: the red counterpart of the ally plate — a threat tag, bigger, so the
         Adept / Herbalist / Quartermaster read out of a war-camp the instant they're on screen. */
      .plate.champion { color: #ff6a5a; border-color: rgba(210,60,60,0.6);
        text-shadow: 0 0 9px rgba(210,60,60,0.7); letter-spacing: .1em; font-size: 13px; }
      /* No dot on a champion — the red NAME is the whole tag. A symbol shared with the green
         ally marker made "friend" and "target" wear the same shape. */
      #levelbanner {
        position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(0.7);
        font-size: 52px; font-weight: 800; letter-spacing: .06em; text-align: center;
        color: #ffe08a; text-shadow: 0 0 24px rgba(255,206,94,0.9), 0 3px 10px #000a;
        opacity: 0; pointer-events: none; white-space: nowrap;
        -webkit-text-stroke: 1px #7a5a12;
      }
      #levelbanner.show { animation: levelpop 1.9s cubic-bezier(.2,.9,.2,1) forwards; }
      @keyframes levelpop {
        0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
        14%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
        24%  { transform: translate(-50%,-50%) scale(1.0); }
        75%  { opacity: 1; transform: translate(-50%,-52%) scale(1.0); }
        100% { opacity: 0; transform: translate(-50%,-58%) scale(1.0); }
      }
      body.running #crosshair { opacity: .9; }
      /* NO MOUSE ARROW DURING PLAY. Pointer lock hides the system cursor itself, but only
         while it holds — and it drops constantly: Chrome refuses to re-acquire it for over a
         second after Escape, and any click that lands outside the canvas releases it. In that
         window the arrow sits over the middle of a firefight pointing at nothing, because
         aiming is the crosshair and always has been.
         Keyed on `running`, so every panel that pauses the game (the shop, the character
         sheet, the slot picker, the death screen) gets the cursor straight back — those are
         the only places it means anything. */
      /* :not(.dead) is a BELT AND BRACES. The class bookkeeping is the real fix (see
         onDeath), but a hidden cursor on a screen whose only control is a button is
         unrecoverable without a reload — so the stylesheet refuses to hide it while dead
         no matter what any script forgets to do. */
      body.running:not(.dead), body.running:not(.dead) canvas { cursor: none; }
      #health, #ammo, #xp, #rep, #jumps, #energy { opacity: 0; transition: opacity .2s; }
      body.running #health, body.running #ammo, body.running #xp, body.running #rep,
      body.running #jumps, body.running #energy { opacity: 1; }
      /* "Move outward" nudge — shows when your zone has greyed out (little/no xp). */
      /* The sleep nudge: a quiet line while you stand in a safe town after dark. Teaches
         the ONE key the night wants without a tutorial — and only when it's usable. */
      #sleephint { position: absolute; left: 50%; bottom: 236px; transform: translateX(-50%);
        font: 600 12px/1.4 ui-sans-serif, system-ui, sans-serif; color: #b9c6da;
        text-shadow: 0 2px 6px #000b; letter-spacing: .08em; opacity: 0;
        transition: opacity .4s; pointer-events: none; }
      #sleephint.show { opacity: .85; }
      /* BOSS HEALTH — top centre, big, and red.
         It was twenty ASCII blocks inside the debug readout: top-left corner, 10px, 40%
         opacity, wrapped in coordinates and camera settings. That is precisely where you
         are not looking while a boss is beaming you. A boss is the one fight whose
         remaining health has to be legible from peripheral vision, so it gets the one
         piece of screen nothing else uses and a colour that means exactly one thing. */
      #bossbar { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
        /* The vw term is what keeps it off the minimap on a smaller window — at 52vw the
           two were within fourteen pixels of touching at 1024 wide. */
        width: min(720px, 46vw); opacity: 0; transition: opacity .3s; pointer-events: none; }
      #bossbar.show { opacity: 1; }
      #bossbar .bb-top { display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 5px; font: 800 12px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .2em; color: #ff8f8f; text-shadow: 0 2px 6px #000d; }
      #bossbar .bb-hp { font-weight: 700; letter-spacing: .06em; color: #ffdede; }
      #bossbar .bb-track { height: 20px; background: #1a0707dd; border: 1px solid #8d2222;
        border-radius: 5px; overflow: hidden; box-shadow: 0 2px 14px #000b, 0 0 20px #ff2a2a2e; }
      #bossbar .bb-fill { height: 100%; background: linear-gradient(180deg, #ff5f4d, #c60f0f 60%, #8d0505);
        box-shadow: 0 0 16px #ff3b2ecc; transition: width .18s linear; }
      /* Phase 2 changes the fight, so it changes the bar: hotter colour and a pulse you can
         catch without reading a word. */
      #bossbar.enraged .bb-top { color: #ffc36a; }
      #bossbar.enraged .bb-track { border-color: #ffae3a; }
      #bossbar.enraged .bb-fill { background: linear-gradient(180deg, #ff9a3a, #e21616 60%, #a30505);
        animation: bbpulse .55s ease-in-out infinite alternate; }
      @keyframes bbpulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }
      #alert { position: absolute; left: 50%; top: 74px; transform: translateX(-50%);
        opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center;
        font: 700 15px/1.4 ui-sans-serif, system-ui, sans-serif; color: #ffe08a;
        text-shadow: 0 2px 8px #000d; letter-spacing: .03em; }
      #alert.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="stats"></div>
      <div id="crosshair"></div>
      <div id="lowhp"></div>
      <div id="hurt"></div>
      <div id="subtitle"></div>
      <div id="chat"></div>
      <div id="sleep">the town sleeps…</div>
      <div id="points"></div>
      <div id="health"></div>
      <div id="ammo"></div>
      <div id="rep"></div>
      <div id="xp"></div>
      <div id="energy"><div class="en-fill"></div><span class="en-word">ENERGY</span></div>
      <div id="wpncd"></div>
      <div id="jumps"></div>
      <div id="bossbar"></div>
      <div id="alert"></div>
      <div id="sleephint">🌙 night in town &nbsp;·&nbsp; press <b>Z</b> to sleep</div>
      <div id="levelbanner"></div>
      <div id="bar"></div>
      <div id="buildtag"></div>
      <div id="plates"></div>
      <div id="hpbars"></div>
      <div id="dmg"></div>
      <canvas id="minimap" width="180" height="180"></canvas>
      <div id="slots" style="display:none"></div>
      <div id="difficulty" style="display:none"></div>
      <div id="click">CLICK TO PLAY &nbsp;·&nbsp; WASD move &nbsp; SPACE double-jump &nbsp; double-tap WASD dodge &nbsp; LMB fire &nbsp; RMB aim &nbsp; R reload &nbsp; F5 camera &nbsp; [ ] look &nbsp; M music &nbsp; Z sleep &nbsp; F talk / enter dungeon &nbsp; C potion &nbsp; Q E 1-4 spells &nbsp; wheel switch weapon</div>
    </div>
    <!-- Outside #hud on purpose: the HUD is pointer-events:none so it never eats clicks,
         and the shop is the one overlay that must receive them. -->
    <div id="shop"></div>
    <div id="inv"></div>
    <div id="death">
      <div class="dpanel">
        <h1>YOU DIED</h1>
        <p id="death-sub"></p>
        <button id="respawn-btn">Respawn in nearest safe zone</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
